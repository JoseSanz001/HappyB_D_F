<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tu galaxia de amor 💞</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sorpresa.css') }}">
</head>
<body>
  <canvas id="galaxia"></canvas>

  <div class="mensajes">
    <h1>✨ Nuestra galaxia de amor ✨</h1>
    <p class="texto">Eres mi universo, mi estrella favorita 🌙</p>
    <p class="texto">Te adoro con todo mi corazón 💗</p>
    <p class="texto">Gracias por iluminar mi vida 💫</p>
    <p class="texto">Feliz cumpleaños, mi amor ❤️</p>
  </div>

  <script src="{{ url_for('static', filename='js/sorpresa.js') }}"></script>
  <!-- ❤️ Corazones flotantes -->
<style>
  .heart {
    position: fixed;
    bottom: -10px;
    color: #ff80ab;
    font-size: 1.5rem;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    z-index: 999;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) scale(1.5);
      opacity: 0;
    }
  }
</style>

<script>
  function crearCorazon() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.textContent = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }

  setInterval(crearCorazon, 500);
</script>

</body>
</html>
